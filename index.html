<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Колесо</title>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <!-- Колесо -->
    <img src="IMG_2625.PNG" alt="Wheel" class="wheel" id="wheel">

    <!-- Оверлей -->
    <img src="IMG_2626.PNG" alt="Overlay" class="overlay">

    <!-- Сообщение -->
    <div class="message" id="message">Удачи в следующий раз!</div>

    <!-- Кнопка Крутить -->
    <img src="btn-spin.png" alt="Крутить" class="btn btn-spin" id="spinButton">

    <!-- Кнопка Билеты -->
    <div class="btn-bilets-wrapper">
      <img src="btn-bilets.png" alt="Билеты" class="btn btn-bilets">
      <div class="ticket-count" id="ticketCount">3</div>
    </div>
  </div>

  <script>
    const spinButton = document.getElementById("spinButton");
    const wheel = document.getElementById("wheel");
    const message = document.getElementById("message");

    spinButton.addEventListener("click", () => {
      const rotation = 360 * 3 + Math.floor(Math.random() * 360);
      wheel.style.transition = 'transform 3s ease-out';
      wheel.style.transform = `translateX(-50%) rotate(${rotation}deg)`;

      message.classList.remove("visible");
      setTimeout(() => {
        message.classList.add("visible");
      }, 3200);
    });
  </script>
</body>
</html>
