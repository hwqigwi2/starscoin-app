<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Мини апп колесо</title>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <!-- Верхняя полоска -->
    <div class="png-strip-container" id="pngStrip">
      <img src="IMG_2677.PNG" alt="PNG слева" class="png-strip-left" />
      <div class="jpg-strip" id="jpgStrip"></div>
    </div>

    <img src="IMG_2696.PNG" alt="Инфо" class="info-icon" id="infoBtn" />

    <!-- Страница рулетки -->
    <div id="page-roulette" class="page active">
      <div class="wheel-wrapper">
        <img id="wheel" class="wheel" src="IMG_2670.PNG" alt="Колесо" />
        <img id="overlay" class="overlay" src="IMG_2671.PNG" alt="Оверлей" />
      </div>

      <img src="IMG_2518.PNG" alt="Центр" class="center-icon" />

      <div class="btn-bilets-wrapper">
        <img id="btnBilets" class="btn-bilets" src="IMG_2664.PNG" alt="Билеты" />
        <span id="ticketCount" class="ticket-count">3</span>
      </div>

      <div class="btn-spin-wrapper">
        <img id="btnSpin" class="btn-spin" src="IMG_2665.PNG" alt="Крутить" />
      </div>
    </div>

    <!-- Страница приглашений -->
    <div id="page-invite" class="page">
      <div class="invite-container">
        <img src="IMG_2724.PNG" alt="Пригласи друзей" class="invite-top-img">
        <div class="invite-box">
          <div class="invite-box-header">
            <img src="IMG_2723.PNG" alt="Приглашено" class="invite-count-img">
            <div class="invite-count">0</div>
          </div>
          <div class="invite-list">
            <!-- Список приглашенных будет генерироваться динамически -->
          </div>
        </div>
        <img src="IMG_2721.PNG" alt="Поделиться" class="invite-share-img" id="btnShare">
      </div>
    </div>
    
    <!-- Квадраты переключения страниц -->
    <div class="squares-container">
      <!-- ... существующие квадраты ... -->
    </div>
  </div>

  <script src="script.js"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</body>
</html>
