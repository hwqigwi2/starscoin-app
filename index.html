<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Колесо Удачи</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Колесо -->
  <img id="wheel" class="wheel" src="IMG_2598.PNG" alt="Колесо" />

  <!-- Оверлей поверх колеса -->
  <img class="overlay" src="IMG_2595.PNG" alt="Оверлей" />

  <div class="buttons-container">
    <div class="btn-bilets-wrapper">
      <img class="btn btn-bilets" id="btnBilets" src="IMG_2617.PNG" alt="Билеты" />
      <div id="ticketCount" class="ticket-count">3</div>
    </div>
    <img class="btn btn-spin" id="btnSpin" src="IMG_2618.PNG" alt="Крутить" />
  </div>

  <!-- Сообщение -->
  <div class="message" id="message"></div>

  <script src="script.js"></script>
</body>
</html>
