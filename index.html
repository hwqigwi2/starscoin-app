<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Колесо Удачи</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Колесо -->
  <img id="wheel" class="wheel" src="IMG_2598.PNG" alt="Колесо" />

  <!-- Оверлей поверх колеса -->
  <img class="overlay" src="IMG_2595.PNG" alt="Оверлей" />

  <!-- Кнопка билетов -->
  <img class="btn btn-bilets" id="btnBilets" src="IMG_2617.PNG" alt="Билеты" title="Билеты: 3" />

  <!-- Кнопка крутить -->
  <img class="btn btn-spin" id="btnSpin" src="IMG_2618.PNG" alt="Крутить" />

  <!-- Кнопка назад -->
  <img class="btn btn-back" id="btnBack" src="IMG_2623.PNG" alt="Назад" />

  <!-- Сообщение -->
  <div class="message" id="message"></div>

  <script src="script.js"></script>
</body>
</html>
