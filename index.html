<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Мини апп колесо</title>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">

    <div class="main-content">
      <!-- Верхняя полоска -->
      <div class="png-strip-container" id="pngStrip">
        <img src="IMG_2677.PNG" alt="PNG слева" class="png-strip-left" />
        <div class="jpg-strip" id="jpgStrip"></div>
      </div>

      <img src="IMG_2696.PNG" alt="Инфо" class="info-icon" id="infoBtn" />

      <div class="wheel-wrapper">
        <img id="wheel" class="wheel" src="IMG_2670.PNG" alt="Колесо" />
        <img id="overlay" class="overlay" src="IMG_2671.PNG" alt="Оверлей" />
      </div>

      <img src="IMG_2518.PNG" alt="Центр" class="center-icon" />

      <div class="squares-container">
        <div class="square" data-index="0">
          <img src="IMG_2711.PNG" alt="Квадрат левый" class="square-img" />
          <div class="overlay-white"></div>
        </div>
        <div class="square" data-index="1">
          <img src="IMG_2712.PNG" alt="Квадрат средний" class="square-img" />
          <div class="overlay-white"></div>
        </div>
        <div class="square" data-index="2">
          <img src="IMG_2713.PNG" alt="Квадрат правый" class="square-img" />
          <div class="overlay-white"></div>
        </div>
      </div>
    </div>

    <!-- Кнопки, которые должны всегда быть видимы -->
    <div class="btn-bilets-wrapper">
      <img id="btnBilets" class="btn-bilets" src="IMG_2664.PNG" alt="Билеты" />
      <span id="ticketCount" class="ticket-count">3</span>
    </div>

    <div class="btn-spin-wrapper">
      <img id="btnSpin" class="btn-spin" src="IMG_2665.PNG" alt="Крутить" />
    </div>

    <!-- === ЭКРАН ПРИГЛАШЕНИЙ === -->
    <div id="inviteScreen" class="invite-screen" style="display:none;">
      <img src="IMG_2724.PNG" alt="Заголовок приглашений" class="invite-header" />

      <div class="invite-rect">
        <div class="invite-top-bar">
          <img src="IMG_2723.PNG" alt="Заголовок в рамке" class="invite-top-bar-img" />
          <div class="invite-count">Приглашено: <span id="inviteCount">0</span></div>
        </div>

        <div class="invite-list" id="inviteList" style="display:none;">
          <!-- Список приглашённых будет тут -->
        </div>
      </div>

      <img src="IMG_2721.PNG" alt="Поделиться" class="invite-share-btn" id="inviteShareBtn" />
    </div>

  </div>

  <script src="script.js"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</body>
</html>
