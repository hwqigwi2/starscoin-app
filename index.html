<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Мини апп колесо</title>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">

<img src="IMG_2772.PNG" id="topLeftImg" class="top-left-image" style="display: none;" />
<img id="topLeftImg2777" src="IMG_2777.PNG"
     style="display: none; position: absolute; top: 75px; left: 25px; width: 50px; height: 50px; z-index: 10;" />
<img id="topLeftImg2774" src="IMG_2774.PNG"
     style="display: none; position: absolute; top: 78px; left: 70px; width: 120px; height: 17px; z-index: 10;" />
<img id="topLeftImg2773" src="IMG_2773.PNG"
     style="display: none; position: absolute; top: 97px; left: 80px; width: 150px; height: 20px; z-index: 10;" />
<img id="topRightImg2776" src="IMG_2776.PNG"
     style="display: none; position: absolute; top: 75px; right: 20px; width: 140px; height: 45px; z-index: 10;" />


    <div class="main-content">
      <!-- Верхняя полоска -->
      <div class="png-strip-container" id="pngStrip">
        <img src="IMG_2677.PNG" alt="PNG слева" class="png-strip-left" />
        <div class="jpg-strip" id="jpgStrip"></div>
      </div>

      <img src="IMG_2696.PNG" alt="Инфо" class="info-icon" id="infoBtn" />

      <div class="wheel-wrapper">
        <img id="wheel" class="wheel" src="IMG_2670.PNG" alt="Колесо" />
        <img id="overlay" class="overlay" src="IMG_2671.PNG" alt="Оверлей" />
      </div>

      <img src="IMG_2518.PNG" alt="Центр" class="center-icon" />

      <div class="squares-container">
        <div class="square" data-index="0">
          <img src="IMG_2711.PNG" alt="Квадрат левый" class="square-img" />
          <div class="overlay-white"></div>
        </div>
        <div class="square" data-index="1">
          <img src="IMG_2712.PNG" alt="Квадрат средний" class="square-img" />
          <div class="overlay-white"></div>
        </div>
        <div class="square" data-index="2">
          <img src="IMG_2713.PNG" alt="Квадрат правый" class="square-img" />
          <div class="overlay-white"></div>
        </div>
      </div>
    </div>

    <!-- Кнопки, которые должны всегда быть видимы -->
    <div class="btn-bilets-wrapper">
      <img id="btnBilets" class="btn-bilets" src="IMG_2664.PNG" alt="Билеты" />
      <span id="ticketCount" class="ticket-count">3</span>
    </div>

    <div class="btn-spin-wrapper">
      <img id="btnSpin" class="btn-spin" src="IMG_2665.PNG" alt="Крутить" />
    </div>

    <!-- Прямоугольник посередине, появляется при нажатии средней кнопки -->
    <div id="midRect" class="middle-rect" style="display:none;">
      <div class="top-frame">
        <img src="IMG_2723.PNG" alt="В рамке слева" class="top-frame-img" />
      </div>
      <img src="IMG_2724.PNG" alt="Сверху над рамкой" class="above-frame-img" />
      
      <!-- Вот сюда вставлен список рефералов -->
      <div class="referral-names"></div>
      
      <img src="IMG_2721.PNG" alt="Нижняя картинка" class="below-rect-img" />
    </div>

  </div>

  <script src="script.js"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</body>
</html>
