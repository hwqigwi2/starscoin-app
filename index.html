<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Колесо фортуны</title>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <!-- Колесо -->
    <div class="wheel" id="wheel"></div>
    
    <!-- Оверлей -->
    <div class="overlay"></div>
    
    <!-- Кнопки -->
    <div class="buttons">
      <!-- Кнопка билетов -->
      <div class="btn-bilets-wrapper">
        <div class="ticket-count" id="ticket-count">3</div>
      </div>
      
      <!-- Кнопка крутить -->
      <button class="btn-spin" id="spin-btn"></button>
    </div>
    
    <!-- Сообщение -->
    <div class="message" id="message">В следующий раз повезёт!</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
