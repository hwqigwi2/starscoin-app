<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Колесо фортуны</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <img src="IMG_2626.PNG" alt="overlay" class="overlay" />
    <img src="IMG_2625.PNG" alt="wheel" class="wheel" id="wheel" />
    <div class="buttons">
      <button id="spinBtn" class="btn-spin"></button>
      <button class="btn-bilets">
        <span id="ticketCount">3 билета</span>
      </button>
    </div>
  </div>
  <script>
    const wheel = document.getElementById('wheel');
    const spinBtn = document.getElementById('spinBtn');
    const ticketCount = document.getElementById('ticketCount');
    let tickets = 3;
    let deg = 0;
    let isSpinning = false;

    spinBtn.addEventListener('click', () => {
      if (isSpinning || tickets <= 0) return;
      isSpinning = true;
      tickets -= 1;
      ticketCount.textContent = `${tickets} билет${tickets === 1 ? '' : tickets < 5 ? 'а' : 'ов'}`;
      const spinDeg = 3600 + Math.floor(Math.random() * 360);
      wheel.style.transition = 'transform 5s ease-out';
      wheel.style.transform = `rotate(${deg + spinDeg}deg)`;
      deg += spinDeg;
      setTimeout(() => {
        isSpinning = false;
        alert('Попробуй ещё раз!');
      }, 5200);
    });
  </script>
</body>
</html>
