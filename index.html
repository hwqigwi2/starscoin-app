<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Мини апп колесо</title>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <!-- Верхняя полоска -->
    <div class="png-strip-container" id="pngStrip">
      <img src="IMG_2677.PNG" alt="PNG слева" class="png-strip-left" />
      <div class="jpg-strip" id="jpgStrip"></div>
    </div>

<img src="IMG_2699.PNG" alt="Инфо" class="info-icon" id="infoBtn" />

    <div class="wheel-wrapper">
      <img id="wheel" class="wheel" src="IMG_2670.PNG" alt="Колесо" />
      <img id="overlay" class="overlay" src="IMG_2671.PNG" alt="Оверлей" />
    </div>

    <div class="btn-bilets-wrapper">
      <img id="btnBilets" class="btn-bilets" src="IMG_2664.PNG" alt="Билеты" />
      <span id="ticketCount" class="ticket-count">3</span>
    </div>

    <div class="btn-spin-wrapper">
      <img id="btnSpin" class="btn-spin" src="IMG_2665.PNG" alt="Крутить" />
    </div>
  </div>

  <script src="script.js"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</body>
</html>
